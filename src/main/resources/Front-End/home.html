<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Chess - Home</title>
    <link rel="stylesheet" href="styles/styles.css">
    <link rel="icon" href="web-images/chess-world.png" type="image/x-icon">
    <style>
        h1{
            color: white;
        }
        .main-content {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 70vh;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-image: url('web-images/HD-wallpaper-chess-world-king-grass-queen-piece-chess.jpg');
            background-size: cover; /* makes it fill the screen */
            background-repeat: no-repeat;
            background-attachment: fixed; /* keeps it in place when scrolling */
            margin: 0;
            min-height: 100vh;
        }
        .user-panel {
            display: flex;
            align-items: center;
            gap: 10px; /* space between pic and username */
        }

        #profile-pic {
            width: 60px;
            height: 60px;
            border-radius: 50%;   /* circular */
            object-fit: cover;    /* crop nicely */
            cursor: pointer;      /* makes it clickable */
            border: 2px solid #333;
        }
    </style>
</head>
<body>
<div class="chess-container">
    <header class="header">
        <h1>
            <img src="web-images/chess-world.png" alt="Chess World Logo" style="height:70px; vertical-align:middle;">
            Chess World
        </h1>

        <div class="user-panel">
            <img id="profile-pic" src="web-images/wanderercreative-blank-profile-picture-973460_1280.png" alt="Profile Picture" />
            <h2 id="self-name" style="color:white;">Guest</h2>
            <input type="file" id="upload-pic" accept="image/*" hidden />
        </div>
    </header>

    <div class="main-content">
        <div class="control-panel" style="width: 300px; padding: 30px;">
            <h2 style="text-align: center; color: #ccc;">Main Menu</h2>
            <div class="move-controls" style="flex-direction: column; gap: 15px;">
                <button id="menu-new-game" class="btn btn-primary" style="width: 100%;">New Game</button>
                <button id="menu-play-bot" class="btn btn-primary" style="width: 100%;" onclick="window.location.href='game.html?mode=bot'">Play Bot</button>
                <button id="menu-analysis" class="btn btn-primary" style="width: 100%;" onclick="openAnalysisModal()">Analysis</button>
                <button class="btn btn-secondary" style="width: 100%; opacity: 0.5;">Settings</button>
                <button id="logout-btn" class="btn btn-primary" style="width: 100%;">Log Out</button>
            </div>
        </div>
    </div>

    <div id="analysis-modal" class="modal">
        <div class="modal-content">
            <h2>Load Position</h2>
            <p>Enter FEN or leave blank for default.</p>

            <textarea id="fen-input" placeholder="Paste FEN string here (e.g. rnbqk...)" rows="3" style="width: 100%; margin-bottom: 10px;"></textarea>

            <div class="modal-buttons">
                <button id="load-board-btn" class="btn btn-primary" onclick="startAnalysis()">Load Board</button>
                <button id="cancel-analysis-btn" class="btn btn-secondary" onclick="closeAnalysisModal()">Cancel</button>
            </div>
            <p style="font-size: 0.8em; color: gray; margin-top: 5px;">(PGN support coming soon)</p>
        </div>
    </div>
</div>

<script src="scripts/chess-engine-api.js"></script>
<script src="scripts/chess-ui.js"></script>
<script src="scripts/update-interface.js"></script>
<script>
    function openAnalysisModal() {
        document.getElementById('analysis-modal').style.display = 'block';
    }
    function closeAnalysisModal() {
        document.getElementById('analysis-modal').style.display = 'none';
    }
    function startAnalysis() {
        const input = document.getElementById('fen-input').value.trim();
        if (input) {
            sessionStorage.setItem('analysis_fen', input);
        } else {
            sessionStorage.removeItem('analysis_fen'); // Default
        }
        window.location.href = 'game.html?mode=analysis';
    }
</script>
</body>
</html>
