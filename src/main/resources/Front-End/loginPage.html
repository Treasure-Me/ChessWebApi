<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chess Server - Login</title>
    <style>
        /* Basic chess-themed styling */
        body {
            font-family: 'Segoe UI', sans-serif;
            background: #2c3e50;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .login-container {
            background: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 400px;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            color: #2c3e50;
            margin: 10px 0;
        }

        .header .subtitle {
            color: #7f8c8d;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            color: #34495e;
            font-weight: 500;
        }

        .form-group input {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 5px;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        .form-group input:focus {
            outline: none;
            border-color: #3498db;
        }

        .btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-bottom: 10px;
            transition: background-color 0.3s;
        }

        .btn-primary {
            background: #2980b9;
            color: white;
        }

        .btn-primary:hover {
            background: #3498db;
        }

        .btn-secondary {
            background: #ecf0f1;
            color: #2c3e50;
        }

        .btn-secondary:hover {
            background: #bdc3c7;
        }

        .divider {
            text-align: center;
            margin: 20px 0;
            color: #95a5a6;
            position: relative;
        }

        .divider::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 0;
            right: 0;
            height: 1px;
            background: #ecf0f1;
        }

        .divider span {
            background: white;
            padding: 0 10px;
            position: relative;
        }

        .guest-info {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 5px;
            margin-top: 20px;
            border-left: 4px solid #2ecc71;
        }

        .guest-info p {
            margin: 0;
            color: #27ae60;
            font-size: 14px;
        }

        .server-status {
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid #ecf0f1;
            text-align: center;
            color: #7f8c8d;
            font-size: 14px;
        }

        .error-message {
            background: #ffebee;
            color: #c0392b;
            padding: 10px;
            border-radius: 5px;
            margin-bottom: 20px;
            display: none;
        }
    </style>
</head>
<body>
<div class="login-container">
    <div class="header">
        <h1>♔ Chess Server</h1>
        <p class="subtitle">Play chess online with friends</p>
    </div>

    <div id="errorMessage" class="error-message"></div>

    <!-- Login Form -->
    <form id="loginForm">
        <div class="form-group">
            <label for="username">Username</label>
            <input type="text" id="username" name="username" required>
        </div>

        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password">
            <small style="color: #7f8c8d; font-size: 12px;">Leave blank for guest login</small>
        </div>

        <button type="submit" class="btn btn-primary">
            Login / Register
        </button>
    </form>

    <div class="divider">
        <span>OR</span>
    </div>

    <button id="quickGuestBtn" class="btn btn-secondary">
        Quick Guest Login
    </button>

    <div class="guest-info">
        <p>Guest players get a random username and can play immediately. No password needed.</p>
    </div>

    <div class="server-status">
        <span id="serverStatus">Connecting to server...</span>
    </div>
</div>

<script>
    // Show error message
    function showError(message) {
        const errorDiv = document.getElementById('errorMessage');
        errorDiv.textContent = message;
        errorDiv.style.display = 'block';
    }

    // Hide error message
    function hideError() {
        document.getElementById('errorMessage').style.display = 'none';
    }

    // Check server status
    async function checkServerStatus() {
        try {
            // GET request to check if server is alive
            const response = await fetch('/api/health', {
                method: 'GET'
            });

            if (response.ok) {
                const data = await response.json();
                document.getElementById('serverStatus').textContent =
                    `Server: Online (${data.players || 0} players)`;
                return true;
            }
        } catch (error) {
            document.getElementById('serverStatus').textContent = 'Server: Offline';
            return false;
        }
    }

    // Handle form submission
    document.getElementById('loginForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        hideError();

        const username = document.getElementById('username').value.trim();
        const password = document.getElementById('password').value;

        if (!username) {
            showError('Username is required');
            return;
        }

        try {
            const response = await fetch('/api/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: `username=${encodeURIComponent(username)}&password=${encodeURIComponent(password)}`
            });

            const result = await response.json();

            if (result.success) {
                // Redirect to game page after successful login
                window.location.href = '/home.html';
            } else {
                showError(result.message);
            }
        } catch (error) {
            console.error('Login error:', error);
            showError('Network error. Please check server connection.');
        }
    });


    // Handle quick guest login button
    document.getElementById('quickGuestBtn').addEventListener('click', async function() {
        hideError();

        try {
            // POST request for guest login (no password)
            const response = await fetch('/api/login/guest', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/x-www-form-urlencoded',
                },
                body: ``
            });

            if (response.ok) {
                const result = await response.json();
                if (result.success) {
                    window.location.href = '/home.html';
                } else {
                    showError('Guest login failed');
                }
            }
        } catch (error) {
            showError('Cannot connect to server');
        }
    });

    // Check server status on load and every 30 seconds
    checkServerStatus();
    setInterval(checkServerStatus, 30000);

    // Optional: Auto-focus username field
    document.getElementById('username').focus();
</script>
</body>
</html>
