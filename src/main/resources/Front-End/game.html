<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Chess - Playing</title>
    <link rel="stylesheet" href="styles/styles.css">
    <link rel="icon" href="web-images/chess-world.png" type="image/x-icon">
    <style>
        h1{
            color: white;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-image: url('web-images/HD-wallpaper-chess-world-king-grass-queen-piece-chess.jpg');
            background-size: cover;
            background-repeat: no-repeat;
            background-attachment: fixed;
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* --- LAYOUT CONTAINERS --- */

        .chess-container {
            width: 100%;
            max-width: 1400px;
            padding: 20px;
            /* Optional: Add background to container for readability */
            background: rgba(0, 0, 0, 0.4); 
            border-radius: 10px;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 20px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
        }

        .main-content {
            display: flex;
            flex-direction: row;
            justify-content: center;
            align-items: flex-start;
            gap: 30px;
            flex-wrap: wrap; /* responsive wrap */
        }

        /* --- THE GAME AREA (Left Side) --- */
        
        /* 1. Horizontal Row: Holds [Eval Bar] + [Vertical Stack] */
        .game-layout-row {
            display: flex;
            flex-direction: row;
            align-items: stretch; /* CRITICAL: This forces Eval Bar to match Board Stack height */
            gap: 15px;
        }

        /* 2. Vertical Stack: Holds [Opponent] + [Board] + [Self] */
        .board-stack {
            display: flex;
            flex-direction: column;
            width: fit-content;
        }

        /* --- COMPONENTS --- */

        /* Eval Bar */
        .eval-bar-container {
            width: 24px;
            /* Height is auto so it stretches via flexbox */
            background: #333;
            border: 2px solid #555;
            position: relative;
            border-radius: 4px;
            display: none; /* Hidden until Analysis Mode */
        }

        .eval-bar-white {
            width: 100%;
            background: white;
            position: absolute;
            bottom: 0;
            height: 50%;
            transition: height 0.5s ease;
        }

        .eval-score {
            position: absolute;
            top: 5px;
            width: 100%;
            text-align: center;
            font-size: 10px;
            color: #fff;
            font-weight: bold;
            z-index: 2;
            text-shadow: 0 0 2px black;
        }

        /* Player Strips */
        .player-strip {
            display: flex;
            align-items: center;
            background-color: rgba(40, 30, 20, 0.95);
            color: white;
            padding: 8px 15px;
            height: 60px;
            width: 100%; /* Fill the stack width */
            box-sizing: border-box;
            border: 4px solid #5c3a21; /* Match board border thickness */
        }

        .player-strip.opponent {
            border-bottom: none; /* Merge with board */
            border-radius: 5px 5px 0 0;
        }

        .player-strip.self {
            border-top: none; /* Merge with board */
            border-radius: 0 0 5px 5px;
        }

        /* Profile Elements */
        .profile-pic {
            width: 40px;
            height: 40px;
            border-radius: 5px;
            border: 2px solid #aaa;
            margin-right: 15px;
            object-fit: cover;
        }
        
        .profile-pic.clickable {
            cursor: pointer;
            border-color: #4CAF50;
        }

        .player-info {
            display: flex;
            flex-direction: column;
            line-height: 1.2;
        }

        .username { font-weight: bold; font-size: 1.1em; color: #f0f0f0; }
        .status { font-size: 0.9em; color: #ccc; }
    </style>
</head>
<body>

<div class="chess-container">
    
    <header class="header">
        <h1>
            <img src="web-images/chess-world.png" alt="Chess World Logo" style="height:70px; vertical-align:middle;">
            Chess World
        </h1>
        <div class="game-info">
            <div id="sync-status" style="width: 12px; height: 12px; background: gray; border-radius: 50%; display: inline-block; margin-right: 10px;" title="Connection"></div>
            <span id="game-status">Initializing...</span>
        </div>
        <div id="loading-spinner" style="display:none; color: #4CAF50; font-weight: bold; margin-top: 5px;">Thinking...</div>
    </header>

    <div class="main-content">

        <div class="game-layout-row">
            
            <div id="eval-bar" class="eval-bar-container">
                <div id="eval-fill" class="eval-bar-white"></div>
                <span id="eval-text" class="eval-score">0.0</span>
            </div>

            <div class="board-stack">
                
                <div class="player-strip opponent">
                    <img src="web-images/wanderercreative-blank-profile-picture-973460_1280.png" id="opp-pic" class="profile-pic" alt="Opponent">
                    <div class="player-info">
                        <span id="opp-name" class="username">Waiting...</span>
                        <span id="opp-rating" class="status">Online</span>
                    </div>
                </div>

                <div class="chess-board" id="chess-board"></div>

                <div class="player-strip self">
                    <img src="web-images/wanderercreative-blank-profile-picture-973460_1280.png" id="self-pic" class="profile-pic clickable" alt="Me">
                    <div class="player-info">
                        <span id="self-name" class="username">Guest</span>
                        <span id="player-turn" class="status">Your Turn</span>
                    </div>
                    <input type="file" id="upload-pic" accept="image/*" hidden />
                </div>

            </div> </div> <div class="control-panel">
            <div id="analysis-controls" style="display:none; margin-bottom: 10px;">
                <button class="btn btn-secondary" onclick="window.chessApp.resetAnalysis()">Reset Position</button>
            </div>
            
            <div class="move-controls">
                <button id="resign" class="btn btn-danger">Resign</button>
                <button id="home" class="btn btn-secondary" onclick="window.location.href='home.html'">Home</button>
                <button id="logout-btn" class="btn btn-secondary">Log out</button>
            </div>

            <div class="move-history">
                <h3>Move History</h3>
                <div id="move-list" class="move-list"></div>
            </div>
        </div>

    </div>

    <div class="modal" id="game-over-modal">
        <div class="modal-content">
            <h2 id="modal-title">Game Over</h2>
            <p id="modal-message"></p>
            <div class="modal-buttons">
                <button id="modal-new-game" class="btn btn-secondary" onclick="location.reload()">Play Again</button>
                <button id="modal-home" class="btn btn-secondary" onclick="window.location.href='home.html'">Home</button>
            </div>
        </div>
    </div>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
<script src="scripts/chess-utils.js"></script>
<script src="scripts/UCIEngine.js"></script>
<script src="scripts/chess-engine-api.js"></script>
<script src="scripts/chess-ui.js"></script>

<script>
    const pic = document.getElementById('self-pic');
    const input = document.getElementById('upload-pic');
    if(pic && input) {
        pic.addEventListener('click', () => input.click());
        input.addEventListener('change', (e) => {
            if (e.target.files[0]) {
                const r = new FileReader();
                r.onload = (e) => pic.src = e.target.result;
                r.readAsDataURL(e.target.files[0]);
            }
        });
    }
</script>

</body>
</html>
