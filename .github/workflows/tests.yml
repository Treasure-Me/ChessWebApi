name: Chess Api Tests

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build project (creates executable JAR)
        run: mvn clean package -DskipTests -B --no-transfer-progress

      - name: Install Google Chrome (required for Selenium)
        run: |
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable

      - name: Start Javalin Server in background
        run: |
          nohup java -jar target/ChessWebApi-1.0-SNAPSHOT.jar > server.log 2>&1 &
          echo $! > server.pid
          echo "Waiting for server to start..."
          sleep 12

      - name: Wait for server to be ready
        run: |
          timeout 30 bash -c '
            until curl -s -f http://localhost:5000/api/health > /dev/null; do
              sleep 2
            done
          ' || (echo "Server failed to start" && cat server.log && exit 1)

      - name: Run Selenium Tests
        run: mvn test -Dtest=ChessUITest,WebDriverHealthCheckTest --no-transfer-progress

      - name: Upload test reports (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: target/surefire-reports/

      - name: Show server log on failure
        if: failure()
        run: cat server.log

      - name: Stop server
        if: always()
        run: |
          if [ -f server.pid ]; then
            kill $(cat server.pid) || true
          fi